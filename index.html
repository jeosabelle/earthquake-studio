<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Earthquake Dubbing Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="screen-config" class="container">
        <div class="card">
            <h1 class="title">🎬 Earthquake Emergency Dialogue</h1>
            <p class="subtitle">Teacher Control Panel</p>
            
            <div class="form-group">
                <label>Teacher Name</label>
                <input type="text" id="input-teacher-name" value="Teacher Jeosa">
            </div>
            
            <div class="form-group">
                <label>Google Apps Script Web App URL</label>
                <input type="text" id="input-script-url" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            
            <div class="form-group">
                <label>Google Drive Root Folder ID</label>
                <input type="text" id="input-folder-id" value="1tGHPu6gwU-4UWCHAanK2PNyG27cz5WWh">
            </div>
            
            <div class="form-group">
                <label>Upload Video Asset (Silent Video)</label>
                <input type="file" id="input-video-file" accept="video/*">
            </div>
            
            <div class="form-group">
                <label>Class Designations</label>
                <textarea id="input-classes" rows="2">801,802,803,804,805,806,807,808,809,810</textarea>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button id="btn-save-config" type="button" class="btn btn-primary">Save Configuration</button>
                <button id="btn-to-student-setup" type="button" class="btn btn-accent" style="opacity:1; pointer-events:auto;">Start Activity ➔</button>
            </div>
        </div>
    </div>

    <div id="screen-login" class="container hidden">
        <div class="card" style="max-width: 450px;">
            <h2 class="title">🔐 Student Check-In</h2>
            <p class="subtitle">Earthquake Voice Actor Studio</p>
            
            <div class="form-group">
                <label>Select Your Class</label>
                <select id="select-class"></select>
            </div>
            
            <div class="form-group">
                <label>Group Number / Name</label>
                <input type="text" id="input-group-name" placeholder="e.g., Group 1">
            </div>
            
            <div class="form-group">
                <label>Student Names in Group</label>
                <input type="text" id="input-students" placeholder="e.g., Andy, Bella">
            </div>
            
            <button id="btn-enter-studio" type="button" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Enter Recording Studio 🎬</button>
        </div>
    </div>

    <div id="screen-studio" class="studio-container hidden">
        <div class="studio-header">
            <span id="studio-group-tag" class="badge">Class - Group</span>
            <span id="countdown-overlay" style="color: #ff3b30; font-weight: bold; margin-left: 15px;"></span>
        </div>

        <div class="video-workspace-centered">
            <div class="video-frame-wrapper">
                <video id="video-playback" playsinline></video>
                <video id="video-webcam" autoplay muted playsinline></video>
            </div>
        </div>

        <div class="studio-controls">
            <button id="btn-start-cam" type="button" class="btn btn-outline">📹 Start Camera</button>
            <button id="btn-start-record" type="button" class="btn btn-primary" disabled>🔴 Start Recording</button>
            <button id="btn-stop-record" type="button" class="btn btn-danger" disabled>⏹ Stop & Save</button>
        </div>

        <div id="upload-status-toast" class="toast hidden">
            <div id="upload-status-title" style="font-weight: bold; margin-bottom: 5px;">Preparing Upload...</div>
            <div class="progress-bar-container">
                <div id="upload-progress" class="progress-bar-fill"></div>
            </div>
            <div id="upload-status-msg" style="font-size: 0.85rem; margin-top: 5px; color: #aaa;">Connecting to Google Drive...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
