<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Earthquake Dubbing Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="screen-login" class="container">
        <div class="card" style="max-width: 450px;">
            <h1 class="title">🎬 Earthquake Emergency Dialogue</h1>
            <p class="subtitle">Voice Actor Studio Check-In</p>
            
            <div class="form-group">
                <label>Select Your Class / 選擇班級</label>
                <select id="select-class">
                    <option value="801">801</option>
                    <option value="802">802</option>
                    <option value="803">803</option>
                    <option value="804">804</option>
                    <option value="805">805</option>
                    <option value="806">806</option>
                    <option value="807">807</option>
                    <option value="808">808</option>
                    <option value="809">809</option>
                    <option value="810">810</option>
                    <option value="811">811</option>
                    <option value="812">812</option>
                    <option value="813">813</option>
                    <option value="814">814</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Group Number / 組別</label>
                <input type="text" id="input-group-name" placeholder="e.g., Group 1">
            </div>
            
            <div class="form-group">
                <label>Student Numbers in Group / 座號</label>
                <input type="text" id="input-students" placeholder="e.g., 05, 12, 23">
            </div>

            <div class="form-group">
                <label>Step 1: Choose Silent Video File / 選擇影片</label>
                <input type="file" id="input-video-file" accept="video/*" style="padding: 5px 0;">
            </div>
            
            <button id="btn-enter-studio" type="button" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Enter Recording Studio 🎬</button>
        </div>
    </div>

    <div id="screen-studio" class="studio-container hidden">
        <div class="studio-header">
            <span id="studio-group-tag" class="badge">Class - Group</span>
            <span id="countdown-overlay" style="color: #ff3b30; font-weight: bold; margin-left: 15px;"></span>
            
            <div style="margin-left: auto; display: flex; align-items: center; gap: 10px; pointer-events: auto;">
                <label style="font-size: 0.8rem; font-weight: bold; color: #94a3b8;">📷 CAMERA POSITION:</label>
                <select id="select-cam-position" style="width: 140px; padding: 5px 10px; font-size: 0.85rem; background:#16161a;">
                    <option value="bottom-right">Bottom Right</option>
                    <option value="bottom-left">Bottom Left</option>
                    <option value="top-right">Top Right</option>
                    <option value="top-left">Top Left</option>
                </select>
            </div>
        </div>

        <div class="video-workspace-centered">
            <div class="video-frame-wrapper">
                <video id="video-playback" playsinline></video>
                <video id="video-webcam" class="pos-bottom-right" autoplay muted playsinline></video>
                
                <div id="review-container" class="review-overlay hidden">
                    <h3 style="margin-bottom: 10px; color: #10b981;">👀 Review Your Recording / 預覽影片</h3>
                    <video id="video-review" controls playsinline style="width: 100%; max-height: 55vh; border-radius: 6px; background: #000;"></video>
                    <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 8px;">Listen close! Click the purple button below to save your finished video.</p>
                </div>
            </div>
        </div>

        <div class="studio-controls">
            <button id="btn-start-cam" type="button" class="btn btn-outline">📹 Start Camera</button>
            <button id="btn-start-record" type="button" class="btn btn-primary" disabled>🔴 Start Recording</button>
            <button id="btn-pause-record" type="button" class="btn btn-outline" disabled>⏸ Pause</button>
            <button id="btn-stop-record" type="button" class="btn btn-danger" disabled>⏹ Stop Recording</button>
            <button id="btn-retake-record" type="button" class="btn btn-outline" style="border-color: #eab308; color: #eab308;" disabled>🔄 Retake / Delete</button>
            <button id="btn-download-backup" type="button" class="btn btn-accent hidden" style="background-color: #7c3aed;">📥 Download Mixed Video</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
